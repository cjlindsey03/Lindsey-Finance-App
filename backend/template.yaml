AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Lindsey household financial dashboard — API, data, and scheduled jobs

Parameters:
  RentcastApiKey:
    Type: String
    NoEcho: true
  AllowedOrigin:
    Type: String
    Description: Origin allowed to call the API (the deployed SPA's CloudFront URL).
    Default: "*"
  CjPhoneNumber:
    Type: String
    NoEcho: true
    Description: E.164 phone number for CJ's SMS reminders (e.g. +13135551234).
  VictoriaPhoneNumber:
    Type: String
    NoEcho: true
    Description: E.164 phone number for Victoria's SMS reminders (e.g. +13135551234).

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 15
    MemorySize: 256
    Environment:
      Variables:
        DYNAMODB_REGION: !Ref AWS::Region
        # Empty in AWS; set to DynamoDB Local by env.local.json for `sam local`.
        DYNAMODB_LOCAL_ENDPOINT: ""
        ACCOUNTS_TABLE: !Ref AccountsTable
        BALANCE_SNAPSHOTS_TABLE: !Ref BalanceSnapshotsTable
        SPENDING_PLANS_TABLE: !Ref SpendingPlansTable
        PCS_SIMULATIONS_TABLE: !Ref PcsSimulationsTable
        TASKS_TABLE: !Ref TasksTable
        CASHFLOW_EVENTS_TABLE: !Ref CashflowEventsTable
        G2_TABLE: !Ref G2Table
        G3_TABLE: !Ref G3Table
        RENTALS_CACHE_TABLE: !Ref RentalsCacheTable
        RECURRING_BILLS_TABLE: !Ref RecurringBillsTable
        REPORTS_TABLE: !Ref ReportsTable
        REPORTS_BUCKET: !Ref ReportsBucket
        REMINDERS_TOPIC_ARN: !Ref RemindersTopic
        RENTCAST_API_KEY: !Ref RentcastApiKey
        COGNITO_USER_POOL_ID: !Ref HouseholdUserPool

Resources:
  # ---------------- Cognito ----------------
  HouseholdUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: household-pool
      AutoVerifiedAttributes: [email]
      Schema:
        - Name: householdId
          AttributeDataType: String
          Mutable: true
          Required: false
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true

  HouseholdUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref HouseholdUserPool
      ClientName: household-spa
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # ---------------- API Gateway ----------------
  HouseholdApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowHeaders: [Authorization, Content-Type]
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        AllowCredentials: false
      Auth:
        Authorizers:
          CognitoAuthorizer:
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${HouseholdUserPool}
              audience:
                - !Ref HouseholdUserPoolClient
            IdentitySource: $request.header.Authorization
        DefaultAuthorizer: CognitoAuthorizer

  # ---------------- DynamoDB tables ----------------
  AccountsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: accounts
      BillingMode: PAY_PER_REQUEST
      SSESpecification: { SSEEnabled: true }
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }

  BalanceSnapshotsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: balance_snapshots
      BillingMode: PAY_PER_REQUEST
      SSESpecification: { SSEEnabled: true }
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }

  ReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: reports
      BillingMode: PAY_PER_REQUEST
      SSESpecification: { SSEEnabled: true }
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }

  RecurringBillsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: recurring_bills
      BillingMode: PAY_PER_REQUEST
      SSESpecification: { SSEEnabled: true }
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }

  SpendingPlansTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: spending_plans
      BillingMode: PAY_PER_REQUEST
      SSESpecification: { SSEEnabled: true }
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }

  PcsSimulationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: pcs_simulations
      BillingMode: PAY_PER_REQUEST
      SSESpecification: { SSEEnabled: true }
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }

  TasksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: tasks
      BillingMode: PAY_PER_REQUEST
      SSESpecification: { SSEEnabled: true }
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }

  CashflowEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: cashflow_events
      BillingMode: PAY_PER_REQUEST
      SSESpecification: { SSEEnabled: true }
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: eventDate, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: householdId-eventDate-index
          KeySchema:
            - { AttributeName: PK, KeyType: HASH }
            - { AttributeName: eventDate, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  RentalsCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: rentals_cache
      BillingMode: PAY_PER_REQUEST
      SSESpecification: { SSEEnabled: true }
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  G2Table:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: g2_tracker
      PrimaryKey: { Name: PK, Type: String }
      SSESpecification: { SSEEnabled: true }

  G3Table:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: g3_tracker
      BillingMode: PAY_PER_REQUEST
      SSESpecification: { SSEEnabled: true }
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }

  # ---------------- SNS ----------------
  RemindersTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: household-reminders

  CjReminderSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref RemindersTopic
      Protocol: sms
      Endpoint: !Ref CjPhoneNumber

  VictoriaReminderSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref RemindersTopic
      Protocol: sms
      Endpoint: !Ref VictoriaPhoneNumber

  # ---------------- Lambda functions ----------------
  AccountsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/AccountsFunction/
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref AccountsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref BalanceSnapshotsTable }
      Events:
        List:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: "/accounts", Method: get }
        History:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: "/accounts/{accountId}/history", Method: get }
        Create:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: "/accounts", Method: post }
        Update:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: "/accounts/{accountId}", Method: put }
        Delete:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: "/accounts/{accountId}", Method: delete }

  ReportsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/ReportsFunction/
      Handler: index.handler
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref ReportsTable }
        - S3ReadPolicy: { BucketName: !Ref ReportsBucket }
      Events:
        List:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: "/reports", Method: get }

  RecurringBillsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/RecurringBillsFunction/
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref RecurringBillsTable }
      Events:
        List:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: "/recurring-bills", Method: get }
        Create:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: "/recurring-bills", Method: post }
        Update:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: "/recurring-bills/{billId}", Method: put }
        Delete:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: "/recurring-bills/{billId}", Method: delete }

  SpendingPlansFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/SpendingPlansFunction/
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref SpendingPlansTable }
        - DynamoDBCrudPolicy: { TableName: !Ref AccountsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref BalanceSnapshotsTable }
        - DynamoDBReadPolicy: { TableName: !Ref G2Table }
      Events:
        List:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: "/spending-plans", Method: get }
        GetOne:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: "/spending-plans/{planId}", Method: get }
        Create:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: "/spending-plans", Method: post }
        Update:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: "/spending-plans/{planId}", Method: put }
        Delete:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: "/spending-plans/{planId}", Method: delete }
        Commit:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: "/spending-plans/{planId}/commit", Method: post }

  CashflowFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/CashflowFunction/
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref CashflowEventsTable }
        - DynamoDBReadPolicy: { TableName: !Ref AccountsTable }
        - DynamoDBReadPolicy: { TableName: !Ref RecurringBillsTable }
      Events:
        Month:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: "/cashflow/{year}/{month}", Method: get }
        CreateEvent:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: "/cashflow/events", Method: post }
        DeleteEvent:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: "/cashflow/events/{eventId}", Method: delete }

  G1TrackerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/G1TrackerFunction/
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref AccountsTable }
        - DynamoDBReadPolicy: { TableName: !Ref SpendingPlansTable }
      Events:
        Get:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: "/g1", Method: get }
        Reorder:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: "/g1/order", Method: put }

  G2TrackerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/G2TrackerFunction/
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref G2Table }
        - DynamoDBReadPolicy: { TableName: !Ref AccountsTable }
        - DynamoDBReadPolicy: { TableName: !Ref SpendingPlansTable }
      Events:
        Get:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: "/g2", Method: get }
        Update:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: "/g2", Method: put }

  G3TrackerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/G3TrackerFunction/
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref G3Table }
        - DynamoDBReadPolicy: { TableName: !Ref AccountsTable }
      Events:
        Get:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: "/g3", Method: get }
        Create:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: "/g3", Method: post }

  PcsSimulatorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/PcsSimulatorFunction/
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref PcsSimulationsTable }
      Events:
        List:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: "/pcs-simulator", Method: get }
        GetOne:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: "/pcs-simulator/{simulationId}", Method: get }
        Create:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: "/pcs-simulator", Method: post }
        Delete:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: "/pcs-simulator/{simulationId}", Method: delete }

  TasksFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/TasksFunction/
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref TasksTable }
      Events:
        List:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: "/tasks", Method: get }
        Create:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: "/tasks", Method: post }
        Update:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: "/tasks/{taskId}", Method: put }
        Delete:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: "/tasks/{taskId}", Method: delete }

  RentalsProxyFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/RentalsProxyFunction/
      Handler: index.handler
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref RentalsCacheTable }
      Events:
        Get:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: "/rentals", Method: get }

  RemindersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/RemindersFunction/
      Handler: index.handler
      Timeout: 30
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref CashflowEventsTable }
        - DynamoDBReadPolicy: { TableName: !Ref AccountsTable }
        - DynamoDBReadPolicy: { TableName: !Ref RecurringBillsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref SpendingPlansTable }
        - DynamoDBCrudPolicy: { TableName: !Ref ReportsTable }
        - DynamoDBReadPolicy: { TableName: !Ref G2Table }
        - DynamoDBReadPolicy: { TableName: !Ref G3Table }
        - S3WritePolicy: { BucketName: !Ref ReportsBucket }
        - SNSPublishMessagePolicy: { TopicName: !GetAtt RemindersTopic.TopicName }
      Events:
        DailyReminders:
          Type: Schedule
          Properties:
            Schedule: cron(0 12 * * ? *)

  # ---------------- Frontend hosting (S3 + CloudFront) ----------------
  ReportsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-frontend-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Origins:
          - Id: FrontendS3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref FrontendOriginAccessControl
            S3OriginConfig: { OriginAccessIdentity: '' }
        DefaultCacheBehavior:
          TargetOriginId: FrontendS3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          # Managed "CachingOptimized" policy.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        # React Router's client-side routes 404 at the S3 origin on a hard
        # refresh/deep link — serve index.html instead and let the SPA route.
        CustomErrorResponses:
          - { ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html }
          - { ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /index.html }

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}

Outputs:
  ApiUrl:
    Value: !Sub https://${HouseholdApi}.execute-api.${AWS::Region}.amazonaws.com
  UserPoolId:
    Value: !Ref HouseholdUserPool
  UserPoolClientId:
    Value: !Ref HouseholdUserPoolClient
  FrontendBucketName:
    Value: !Ref FrontendBucket
  FrontendDomain:
    Value: !GetAtt FrontendDistribution.DomainName
  FrontendDistributionId:
    Value: !Ref FrontendDistribution
