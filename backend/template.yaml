AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Lindsey household financial dashboard — API, data, and scheduled jobs

Parameters:
  PlaidClientId:
    Type: String
    NoEcho: true
  PlaidSecret:
    Type: String
    NoEcho: true
  PlaidEnv:
    Type: String
    Default: sandbox
    AllowedValues: [sandbox, development, production]
  RentcastApiKey:
    Type: String
    NoEcho: true

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 15
    MemorySize: 256
    Environment:
      Variables:
        DYNAMODB_REGION: !Ref AWS::Region
        ACCOUNTS_TABLE: !Ref AccountsTable
        PLAID_ITEMS_TABLE: !Ref PlaidItemsTable
        BALANCE_SNAPSHOTS_TABLE: !Ref BalanceSnapshotsTable
        TRANSACTIONS_TABLE: !Ref TransactionsTable
        CATEGORY_RULES_TABLE: !Ref CategoryRulesTable
        SPENDING_PLANS_TABLE: !Ref SpendingPlansTable
        PCS_SIMULATIONS_TABLE: !Ref PcsSimulationsTable
        TASKS_TABLE: !Ref TasksTable
        CASHFLOW_EVENTS_TABLE: !Ref CashflowEventsTable
        G2_TABLE: !Ref G2Table
        G3_TABLE: !Ref G3Table
        RENTALS_CACHE_TABLE: !Ref RentalsCacheTable
        REMINDERS_TOPIC_ARN: !Ref RemindersTopic
        PLAID_CLIENT_ID: !Ref PlaidClientId
        PLAID_SECRET: !Ref PlaidSecret
        PLAID_ENV: !Ref PlaidEnv
        RENTCAST_API_KEY: !Ref RentcastApiKey
        COGNITO_USER_POOL_ID: !Ref HouseholdUserPool

Resources:
  # ---------------- Cognito ----------------
  HouseholdUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: household-pool
      AutoVerifiedAttributes: [email]
      Schema:
        - Name: householdId
          AttributeDataType: String
          Mutable: true
          Required: false
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true

  HouseholdUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref HouseholdUserPool
      ClientName: household-spa
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

  # ---------------- API Gateway ----------------
  HouseholdApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        Authorizers:
          CognitoAuthorizer:
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${HouseholdUserPool}
              audience:
                - !Ref HouseholdUserPoolClient
            IdentitySource: $request.header.Authorization
        DefaultAuthorizer: CognitoAuthorizer

  # ---------------- DynamoDB tables ----------------
  AccountsTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: accounts
      PrimaryKey: { Name: PK, Type: String }
      SSESpecification: { SSEEnabled: true }

  PlaidItemsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: plaid_items
      BillingMode: PAY_PER_REQUEST
      SSESpecification: { SSEEnabled: true }
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }

  BalanceSnapshotsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: balance_snapshots
      BillingMode: PAY_PER_REQUEST
      SSESpecification: { SSEEnabled: true }
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }

  TransactionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: transactions
      BillingMode: PAY_PER_REQUEST
      SSESpecification: { SSEEnabled: true }
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: accountId, AttributeType: S }
        - { AttributeName: date, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: accountId-date-index
          KeySchema:
            - { AttributeName: accountId, KeyType: HASH }
            - { AttributeName: date, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  CategoryRulesTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: category_rules
      PrimaryKey: { Name: PK, Type: String }
      SSESpecification: { SSEEnabled: true }

  SpendingPlansTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: spending_plans
      BillingMode: PAY_PER_REQUEST
      SSESpecification: { SSEEnabled: true }
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }

  PcsSimulationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: pcs_simulations
      BillingMode: PAY_PER_REQUEST
      SSESpecification: { SSEEnabled: true }
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }

  TasksTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: tasks
      BillingMode: PAY_PER_REQUEST
      SSESpecification: { SSEEnabled: true }
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }

  CashflowEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: cashflow_events
      BillingMode: PAY_PER_REQUEST
      SSESpecification: { SSEEnabled: true }
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
        - { AttributeName: eventDate, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      GlobalSecondaryIndexes:
        - IndexName: householdId-eventDate-index
          KeySchema:
            - { AttributeName: PK, KeyType: HASH }
            - { AttributeName: eventDate, KeyType: RANGE }
          Projection: { ProjectionType: ALL }

  RentalsCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: rentals_cache
      BillingMode: PAY_PER_REQUEST
      SSESpecification: { SSEEnabled: true }
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  G2Table:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: g2_tracker
      PrimaryKey: { Name: PK, Type: String }
      SSESpecification: { SSEEnabled: true }

  G3Table:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: g3_tracker
      BillingMode: PAY_PER_REQUEST
      SSESpecification: { SSEEnabled: true }
      AttributeDefinitions:
        - { AttributeName: PK, AttributeType: S }
        - { AttributeName: SK, AttributeType: S }
      KeySchema:
        - { AttributeName: PK, KeyType: HASH }
        - { AttributeName: SK, KeyType: RANGE }

  # ---------------- SNS ----------------
  RemindersTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: household-reminders

  # ---------------- Lambda functions ----------------
  PlaidLinkCreateFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties: { Minify: false, Target: "node20", EntryPoints: ["index.js"] }
    Properties:
      CodeUri: functions/plaid-link-create/
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref PlaidItemsTable }
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HouseholdApi
            Path: /plaid/link-token
            Method: post

  PlaidExchangeTokenFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties: { Minify: false, Target: "node20", EntryPoints: ["index.js"] }
    Properties:
      CodeUri: functions/plaid-exchange-token/
      Handler: index.handler
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref PlaidItemsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref AccountsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref TransactionsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref BalanceSnapshotsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref CategoryRulesTable }
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HouseholdApi
            Path: /plaid/exchange-token
            Method: post

  PlaidSyncFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties: { Minify: false, Target: "node20", EntryPoints: ["index.js"] }
    Properties:
      CodeUri: functions/plaid-sync/
      Handler: index.handler
      Timeout: 60
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref PlaidItemsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref AccountsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref TransactionsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref BalanceSnapshotsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref CategoryRulesTable }
        - DynamoDBCrudPolicy: { TableName: !Ref CashflowEventsTable }
      Events:
        DailySync:
          Type: Schedule
          Properties:
            Schedule: cron(0 6 * * ? *)
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HouseholdApi
            Path: /plaid/sync
            Method: post

  AccountsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties: { Minify: false, Target: "node20", EntryPoints: ["index.js"] }
    Properties:
      CodeUri: functions/accounts/
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref AccountsTable }
        - DynamoDBReadPolicy: { TableName: !Ref BalanceSnapshotsTable }
      Events:
        List:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: /accounts, Method: get }
        History:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: /accounts/{accountId}/history, Method: get }
        Update:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: /accounts/{accountId}, Method: put }

  TransactionsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties: { Minify: false, Target: "node20", EntryPoints: ["index.js"] }
    Properties:
      CodeUri: functions/transactions/
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref TransactionsTable }
      Events:
        List:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: /transactions, Method: get }
        Categorize:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: /transactions/{transactionId}/categorize, Method: post }

  CategoryRulesFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties: { Minify: false, Target: "node20", EntryPoints: ["index.js"] }
    Properties:
      CodeUri: functions/category-rules/
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref CategoryRulesTable }
        - DynamoDBReadPolicy: { TableName: !Ref TransactionsTable }
      Events:
        List:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: /category-rules, Method: get }
        Create:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: /category-rules, Method: post }
        Test:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: /category-rules/test, Method: post }
        Update:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: /category-rules/{ruleId}, Method: put }
        Delete:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: /category-rules/{ruleId}, Method: delete }

  SpendingPlansFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties: { Minify: false, Target: "node20", EntryPoints: ["index.js"] }
    Properties:
      CodeUri: functions/spending-plans/
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref SpendingPlansTable }
        - DynamoDBReadPolicy: { TableName: !Ref TransactionsTable }
      Events:
        List:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: /spending-plans, Method: get }
        GetOne:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: /spending-plans/{payDate}, Method: get }
        Create:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: /spending-plans, Method: post }
        Update:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: /spending-plans/{payDate}, Method: put }

  CashflowFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties: { Minify: false, Target: "node20", EntryPoints: ["index.js"] }
    Properties:
      CodeUri: functions/cashflow/
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref CashflowEventsTable }
        - DynamoDBReadPolicy: { TableName: !Ref AccountsTable }
      Events:
        Month:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: /cashflow/{year}/{month}, Method: get }
        CreateEvent:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: /cashflow/events, Method: post }
        DeleteEvent:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: /cashflow/events/{eventId}, Method: delete }

  G1TrackerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties: { Minify: false, Target: "node20", EntryPoints: ["index.js"] }
    Properties:
      CodeUri: functions/g1-tracker/
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref AccountsTable }
      Events:
        Get:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: /g1, Method: get }
        Reorder:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: /g1/order, Method: put }

  G2TrackerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties: { Minify: false, Target: "node20", EntryPoints: ["index.js"] }
    Properties:
      CodeUri: functions/g2-tracker/
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref G2Table }
        - DynamoDBReadPolicy: { TableName: !Ref AccountsTable }
      Events:
        Get:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: /g2, Method: get }
        Update:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: /g2, Method: put }

  G3TrackerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties: { Minify: false, Target: "node20", EntryPoints: ["index.js"] }
    Properties:
      CodeUri: functions/g3-tracker/
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref G3Table }
        - DynamoDBReadPolicy: { TableName: !Ref AccountsTable }
      Events:
        Get:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: /g3, Method: get }
        Create:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: /g3, Method: post }

  PcsSimulatorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties: { Minify: false, Target: "node20", EntryPoints: ["index.js"] }
    Properties:
      CodeUri: functions/pcs-simulator/
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref PcsSimulationsTable }
      Events:
        List:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: /pcs-simulator, Method: get }
        GetOne:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: /pcs-simulator/{simulationId}, Method: get }
        Create:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: /pcs-simulator, Method: post }
        Delete:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: /pcs-simulator/{simulationId}, Method: delete }

  TasksFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties: { Minify: false, Target: "node20", EntryPoints: ["index.js"] }
    Properties:
      CodeUri: functions/tasks/
      Handler: index.handler
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref TasksTable }
      Events:
        List:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: /tasks, Method: get }
        Create:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: /tasks, Method: post }
        Update:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: /tasks/{taskId}, Method: put }
        Delete:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: /tasks/{taskId}, Method: delete }

  RentalsProxyFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties: { Minify: false, Target: "node20", EntryPoints: ["index.js"] }
    Properties:
      CodeUri: functions/rentals-proxy/
      Handler: index.handler
      Timeout: 30
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref RentalsCacheTable }
      Events:
        Get:
          Type: HttpApi
          Properties: { ApiId: !Ref HouseholdApi, Path: /rentals, Method: get }

  RemindersFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties: { Minify: false, Target: "node20", EntryPoints: ["index.js"] }
    Properties:
      CodeUri: functions/reminders/
      Handler: index.handler
      Timeout: 30
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref CashflowEventsTable }
        - DynamoDBReadPolicy: { TableName: !Ref AccountsTable }
        - SNSPublishMessagePolicy: { TopicName: !GetAtt RemindersTopic.TopicName }
      Events:
        DailyReminders:
          Type: Schedule
          Properties:
            Schedule: cron(0 12 * * ? *)

Outputs:
  ApiUrl:
    Value: !Sub https://${HouseholdApi}.execute-api.${AWS::Region}.amazonaws.com
  UserPoolId:
    Value: !Ref HouseholdUserPool
  UserPoolClientId:
    Value: !Ref HouseholdUserPoolClient
